[grpc]
addr = "0.0.0.0:50051"
enable_tls = false

[http]
addr = "0.0.0.0:8080"
enable_tls = false

enable_swagger = true
enable_web_admin = false
enable_console = true
heartbeat_timeout = 120
cleanup_interval = 300
assignment_reconcile_interval = 60
max_upload_bytes = 67108864
files_dir = "./data/files"
execution_logs_dir = "./data/files/execution_logs"

[web_admin]
addr = "0.0.0.0:8081"
enable_tls = false

[database]
db_type = "rocksdb"
path = "./data/rocksdb-node-service"
pool_size = 10

[event_kv]
backend = "rocksdb"
params = { path = "./data/events-rocksdb" }

[logging]
level = "info"
format = "json"
file = "./logs/sms.log"
