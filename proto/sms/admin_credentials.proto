syntax = "proto3";

package sms;

message CredentialInfo {
  string name = 1;
  string provider_kind = 2;
  uint64 version = 3;
  string description = 4;
  bool disabled = 5;
  int64 created_at_ms = 6;
  int64 updated_at_ms = 7;
}

message CredentialMaterial {
  string name = 1;
  string provider_kind = 2;
  string secret = 3;
  uint64 version = 4;
  bool disabled = 5;
  int64 updated_at_ms = 6;
}

message CredentialEvent {
  uint64 revision = 1;
  repeated string upserts = 2;
  repeated string deletes = 3;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  uint64 revision = 1;
  repeated CredentialInfo credentials = 2;
}

message UpsertCredentialRequest {
  string name = 1;
  string secret = 2;
  string description = 3;
  bool disabled = 4;
}

message UpsertCredentialResponse {
  uint64 revision = 1;
}

message DeleteCredentialRequest {
  string name = 1;
}

message DeleteCredentialResponse {
  uint64 revision = 1;
  bool deleted = 2;
}

message WatchCredentialsRequest {
  uint64 since_revision = 1;
}

message WatchCredentialsResponse {
  CredentialEvent event = 1;
}

message ListCredentialMaterialsRequest {}

message ListCredentialMaterialsResponse {
  uint64 revision = 1;
  repeated CredentialMaterial credentials = 2;
}

message WatchCredentialMaterialsRequest {
  uint64 since_revision = 1;
}

message WatchCredentialMaterialsResponse {
  CredentialEvent event = 1;
}

service AdminCredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc UpsertCredential(UpsertCredentialRequest) returns (UpsertCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  rpc WatchCredentials(WatchCredentialsRequest) returns (stream WatchCredentialsResponse);

  rpc ListCredentialMaterials(ListCredentialMaterialsRequest) returns (ListCredentialMaterialsResponse);
  rpc WatchCredentialMaterials(WatchCredentialMaterialsRequest) returns (stream WatchCredentialMaterialsResponse);
}
